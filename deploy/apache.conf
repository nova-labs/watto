# Installed as /etc/apache2/sites-available/wautils.conf by
# deploy/system-setup.sh, which fills in @ALIASES@ (or drops that line).
#
# Certbot only fetches the certificate (certonly --webroot), so this file is
# the whole config. The HTTPS vhost and the redirect to it switch on once the
# certificate exists.

<VirtualHost *:80>
    ServerName wautils.nova-labs.org
    ServerAlias @ALIASES@

    ErrorLog ${APACHE_LOG_DIR}/wautils-error.log
    CustomLog ${APACHE_LOG_DIR}/wautils-access.log combined

    # Let's Encrypt HTTP challenges, answered from disk rather than the app.
    Alias /.well-known/acme-challenge/ /var/www/wautils-acme/.well-known/acme-challenge/
    <Directory /var/www/wautils-acme>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    <IfFile /etc/letsencrypt/live/wautils/fullchain.pem>
        RewriteEngine on
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    </IfFile>

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:7000/
    ProxyPassReverse / http://127.0.0.1:7000/
    RequestHeader set X-Forwarded-Proto http
</VirtualHost>

<IfFile /etc/letsencrypt/live/wautils/fullchain.pem>
<VirtualHost *:443>
    ServerName wautils.nova-labs.org
    ServerAlias @ALIASES@

    ErrorLog ${APACHE_LOG_DIR}/wautils-error.log
    CustomLog ${APACHE_LOG_DIR}/wautils-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wautils/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wautils/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:7000/
    ProxyPassReverse / http://127.0.0.1:7000/
    RequestHeader set X-Forwarded-Proto https
</VirtualHost>
</IfFile>
